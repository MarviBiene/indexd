name: Custom Image

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: indexd_test
      POSTGRES_PASSWORD: indexd_test
      POSTGRES_DB: indexd_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: indexd_test
          POSTGRES_PASSWORD: indexd_test
          POSTGRES_DB: indexd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indexd_test -d indexd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout custom indexd
        uses: actions/checkout@v4
        with:
          path: indexd

      - name: Checkout custom web
        uses: actions/checkout@v4
        with:
          repository: MarviBiene/web
          ref: main
          path: web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: indexd/go.mod
          cache-dependency-path: indexd/go.sum

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build indexd web export
        working-directory: web
        run: bunx nx run indexd:build:export

      - name: Embed custom web module
        shell: bash
        run: |
          rm -rf web/indexd/assets/*
          mkdir -p web/indexd/assets
          cp -R web/dist/apps/indexd-export/.next/* web/indexd/assets/

          rm -rf indexd/_custom_web_indexd
          cp -a web/indexd indexd/_custom_web_indexd

          cd indexd
          go mod edit -replace=go.sia.tech/web/indexd=./_custom_web_indexd
          go mod download

      - name: Generate
        working-directory: indexd
        run: go generate ./...

      - name: Test
        working-directory: indexd
        run: go test ./...

      - name: Setup QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish custom image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./indexd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/marvibiene/indexd:custom
            ghcr.io/marvibiene/indexd:custom-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
